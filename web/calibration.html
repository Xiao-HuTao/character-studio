<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角色工程台 · 表情与眨眼摆位</title><link rel="icon" href="data:,"><script src="/web/common.js"></script><style>
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:#11151c;color:#e6edf6;font:13px 'Microsoft YaHei',sans-serif;display:flex;flex-direction:column;height:100vh}button,input,select{font:inherit;color:inherit;background:#202938;border:1px solid #3a485d;border-radius:6px;padding:7px}button{cursor:pointer}button:disabled{opacity:.4}header{padding:12px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;border-bottom:1px solid #334055}header a{color:#acbfea}label{display:block;margin:8px 0}label input{max-width:120px}main{display:grid;grid-template-columns:220px 1fr 270px;flex:1;min-height:0}aside{padding:14px;overflow:auto;border-right:1px solid #334055}aside.right{border-left:1px solid #334055;border-right:0}#parts{width:100%;height:55vh}#viewport{overflow:auto;position:relative;background-color:#161b24;background-image:conic-gradient(#222936 25%,transparent 0 50%,#222936 0 75%,transparent 0);background-size:24px 24px}#canvas{display:block;touch-action:none;margin:20px auto}#status{padding:10px;border-top:1px solid #334055;min-height:38px}#fields label{display:flex;justify-content:space-between;align-items:center}p{font-size:12px;line-height:1.8;color:#a6b5cc}.primary{background:#385ec0}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1}#progress{max-width:none;width:160px}h2{font-size:15px}.muted{color:#a6b5cc}#error{color:#ffc399}@media(max-width:900px){main{grid-template-columns:170px 1fr}aside.right{grid-column:1/-1;display:flex;gap:20px;flex-wrap:wrap;max-height:280px}#parts{height:35vh}}
</style></head><body><header><strong data-project-name>表情与眨眼</strong><button onclick="studio.go('/')">首页</button><button onclick="studio.go('editor.html')">组装</button><button onclick="studio.go('bind.html')">绑定</button><button onclick="studio.go('features.html')">功能配置</button><button id="motion">动作预览</button><button onclick="studio.go('export.html')">导出</button><button id="save" class="primary">保存当前摆位</button><button id="undo">撤销当前组</button></header>
<header><label>编辑内容 <select id="scope"><option value="expression">19 个表情</option><option value="blink">日常眨眼</option><option value="seated">坐姿替换</option></select></label><label id="stateLabel">表情 <select id="state"></select></label><label id="phaseLabel" hidden>眨眼端点 <select id="phase"><option value="start">起始位置与大小</option><option value="end">最终位置与大小</option></select></label><label>预览进度 <input id="progress" type="range" min="0" max="1" step=".01" value="1"><output id="progressText">100%</output></label><button id="play">播放过渡</button><button id="frame">前进一帧</button><label>缩放 <input id="zoom" type="number" min="10" max="200" step="5" value="45">%</label><label><input type="checkbox" id="raw">仅看原图摆位</label></header>
<main><aside><h2>可编辑部件</h2><select id="parts" size="22" aria-label="当前组部件"></select><p>拖动移动；四角缩放；上方圆点旋转。数值输入保留小数，不自动重新适配。</p><p id="error"></p></aside><div id="viewport"><canvas id="canvas"></canvas></div><aside class="right"><div><h2 id="selection">未选择部件</h2><div id="fields"></div><label><input id="aspect" type="checkbox" checked>锁定宽高比</label><label><input id="hidden" type="checkbox">隐藏当前表情中的部件</label><label><input id="pinned" type="checkbox">固定位置与大小</label><div class="row"><button id="up">上移一层</button><button id="down">下移一层</button></div></div><div><h2>过渡设置</h2><label><input id="authored" type="checkbox">该表情从独立起点过渡</label><button id="setNeutralStart">以平静睫毛设为起点</button><p>修改终点只影响当前表情；起点单独保存。日常眨眼的近侧、远侧起点和终点互不覆盖。</p><p>中间预览不可拖动。请将进度移到正在编辑的端点再调整。</p></div></aside></main><div id="status" role="status">正在读取工程…</div><script type="module" src="/web/calibration.js"></script></body></html>
